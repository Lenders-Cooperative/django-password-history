[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "django-password-history"
version = "2.0.0"
description = ""
authors = [{ name = "Jatin Goel", email = "jatin.goel@thesummitgrp.com" }]
license = "Proprietary"
readme = "README.md"
requires-python = ">=3.11,<4.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/thesummitgrp/stgcore-pypi-django-password-history"
Repository = "https://github.com/thesummitgrp/stgcore-pypi-django-password-history"

[tool.poetry]
packages = [{ include = "django_password_history" }]

[tool.poetry.dependencies]
python = "^3.11"
Django = ">=4.2,<5.3"
django-model-utils = ">=4.5.0"
djangoql = ">=0.15.4"

[tool.poetry.group.dev.dependencies]
pytest= ">=8.3,<9.0"
pytest-django = ">=4.11,<5.0"
invoke = "^2.2.0"
twine = "^5.0.0"
wheel = "^0.43.0"
zest-releaser = "^9.1.3"
coverage = "^7.4.4"
mock = "^5.1.0"
flake8 = "^7.0.0"
tox = ">=4.24,<5.0"
factory-boy = "*"
codecov = "^2.1.13"
black = "^24.3.0"
pre-commit = "^3.7.0"
isort = "^5.13.2"
mypy = ">=1.15,<2.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.tox]
legacy_tox_ini = """
[tox]
env_list =
    django42
    django52
isolated_build = true

[testenv]
description = Run the test suite against a specific Django version.
package = wheel
basepython = python3
deps =
    pytest>=8.3,<9.0
    pytest-django>=4.11,<5.0
    django-model-utils>=4.4.0
    djangoql>=0.15.4
    factory-boy>=3.3.3
    django42: Django>=4.2,<4.3
    django52: Django>=5.2,<5.3

setenv =
    DJANGO_SETTINGS_MODULE = tests.settings

commands =
    python -m pytest
"""

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
disallow_any_generics = false
ignore_missing_imports = true

[tool.isort]
profile = "black"
atomic = true
